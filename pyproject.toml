[project]
name = "agentinc-sdk"
version = "0.7.0"
description = "Developer SDK for the Agentinc agent marketplace platform"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
openai     = ["openai>=1.0"]
anthropic  = ["anthropic>=0.25"]
gemini     = ["google-genai>=1.0"]
memory     = ["redis>=5.0"]
mcp        = ["mcp>=1.0"]
serve      = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "sse-starlette>=2.0"]
dev        = ["pytest>=9.0", "pytest-asyncio>=1.3", "pytest-mock>=3.0", "build>=1.2"]
all        = [
    "openai>=1.0",
    "anthropic>=0.25",
    "google-genai>=1.0",
    "redis>=5.0",
    "mcp>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# DO NOT change this to `packages`, and DO NOT add an `agentinc/__init__.py`.
#
# `agentinc` is a PEP 420 implicit namespace package shared with every other
# agentinc-* distribution (core, engine, loader, runner, adapter, protocols).
# Two ways to break consumers, both of which build without a warning:
#
#   1. Shipping an `agentinc/__init__.py` makes `agentinc` a *regular* package.
#      Its `__path__` collapses to this one directory and every sibling
#      distribution becomes unimportable (`ModuleNotFoundError: agentinc.core`).
#   2. `packages = ["agentinc/sdk"]` looks equivalent but hatchling strips the
#      parent, producing a wheel with a top-level `sdk/` package — importable
#      as `import sdk`, never as `agentinc.sdk`.
#
# `only-include` keeps the `agentinc/` prefix without synthesizing an __init__.
# tests/test_wheel_layout.py builds the wheel and asserts both properties;
# tests/test_packaging.py guards the source tree and the installed namespace.
only-include = ["agentinc/sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: tests that shell out to the build backend (deselect with -m 'not slow')",
]
